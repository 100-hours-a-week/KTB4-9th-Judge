name: Stage Judge CI

# stage에 병합된 커밋만 ECR(cosmos-v2/judge)에 올린다. ECR 스캔이 끝나면 EventBridge가
# Cloud 저장소 eks-promote를 호출해 훈련 클러스터 values PR을 연다.
on:
  push:
    branches: [stage]

permissions:
  contents: read

concurrency:
  group: judge-stage-ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish immutable ECR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-ci
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: cosmos-v2/judge
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::352635536602:role/cosmos-v2-github-stage-judge-ci
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "352635536602"

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push SHA image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
