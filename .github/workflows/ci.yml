name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rails:
    name: Rails smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_DB: judge0_test
          POSTGRES_USER: judge0
          POSTGRES_PASSWORD: judge0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U judge0 -d judge0_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: judge0_test
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      RAILS_MAX_THREADS: 5
      RAILS_SERVER_PROCESSES: 1
      SECRET_KEY_BASE: ci-secret-key-base

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7.0"
          bundler: "2.1.4"
          bundler-cache: true

      - name: Prepare test database
        run: bundle exec rails db:prepare

      - name: Verify Rails boots
        run: bundle exec rails runner 'abort "Rails failed to boot" unless Rails.application'

  docker:
    name: Build production image
    runs-on: ubuntu-latest
    needs: rails

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: ${{ github.event_name == 'push' }}
          tags: gwanghyeonkim/cosmosejudege:${{ github.sha }}
          cache-from: type=gha
