name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Docker Hub image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          : "${EC2_HOST:?EC2_HOST secret is required}"
          : "${EC2_USER:?EC2_USER secret is required}"
          : "${EC2_SSH_KEY:?EC2_SSH_KEY secret is required}"
          : "${EC2_KNOWN_HOSTS:?EC2_KNOWN_HOSTS secret is required}"
          : "${EC2_DEPLOY_PATH:?EC2_DEPLOY_PATH secret is required}"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          JUDGE0_IMAGE: gwanghyeonkim/cosmosejudege:${{ github.event.workflow_run.head_sha }}
        run: |
          printf -v deploy_script 'set -euo pipefail
          cd %q
          test -f docker-compose.yml
          test -f judge0.conf

          image=%q
          export JUDGE0_IMAGE="$image"

          docker compose pull server worker
          docker compose up -d --force-recreate --remove-orphans

          server_container=$(docker compose ps -q server)
          worker_container=$(docker compose ps -q worker)
          test -n "$server_container"
          test -n "$worker_container"
          test "$(docker inspect --format '\''{{.Config.Image}}'\'' "$server_container")" = "$image"
          test "$(docker inspect --format '\''{{.Config.Image}}'\'' "$worker_container")" = "$image"
          docker compose ps
          ' "$EC2_DEPLOY_PATH" "$JUDGE0_IMAGE"
          bash -n -c "$deploy_script"
          printf -v remote_command 'bash -lc %q' "$deploy_script"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" "$remote_command"
